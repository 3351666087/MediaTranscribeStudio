name: Tauri Linux release candidate

"on":
  workflow_dispatch:
    inputs:
      target:
        description: Linux Rust target triple
        required: true
        default: x86_64-unknown-linux-gnu
        type: choice
        options:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
      bundles:
        description: Comma-separated AppImage, deb, and/or rpm outputs
        required: true
        default: appimage,deb,rpm
        type: string
      channel:
        description: Release channel recorded in the manifest
        required: true
        default: stable
        type: string

permissions:
  contents: read

concurrency:
  group: mts-linux-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux ${{ inputs.target }}
    runs-on: ${{ inputs.target == 'aarch64-unknown-linux-gnu' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      MTS_TARGET: ${{ inputs.target }}
      MTS_BUNDLES: ${{ inputs.bundles }}
      MTS_CHANNEL: ${{ inputs.channel }}
      MTS_EXPECTED_RUNNER_ARCH: ${{ inputs.target == 'aarch64-unknown-linux-gnu' && 'aarch64' || 'x86_64' }}

    steps:
      - name: Check out locked source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri and package inspection dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            rpm \
            cpio \
            libarchive-tools

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Java 17 for OpenHTMLtoPDF
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Assert target-native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_architecture="$(uname -m)"
          test "$actual_architecture" = "$MTS_EXPECTED_RUNNER_ARCH"

      - name: Install Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "$MTS_TARGET"

      - name: Build the locked PDF sidecar
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f pdf-renderer/pom.xml package
          test -f pdf-renderer/target/pdf-renderer.jar

      - name: Validate the cross-host release plan
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/tauri/build_tauri_linux_release.py \
            --target-triple "$MTS_TARGET" \
            --bundles "$MTS_BUNDLES" \
            --channel "$MTS_CHANNEL" \
            --dry-run

      - name: Build and collect native Linux candidate
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          output="$RUNNER_TEMP/mts-release/linux-${MTS_TARGET%%-*}"
          python3 packaging/tauri/build_tauri_linux_release.py \
            --target-triple "$MTS_TARGET" \
            --bundles "$MTS_BUNDLES" \
            --channel "$MTS_CHANNEL" \
            --source-date-epoch "$source_date_epoch" \
            --output-directory "$output"
          echo "MTS_LINUX_OUTPUT=$output" >> "$GITHUB_ENV"

      - name: Assert embedded runtime verification in the manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$MTS_LINUX_OUTPUT/linux-release-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          runtime = manifest["runtimeBootstrap"]
          assert runtime["embedded"] is True
          assert runtime["bundledModelArtifacts"] is False
          assert runtime["fileCount"] > 0
          assert all(item["verified"] for item in runtime["artifactVerifications"])
          PY

      - name: Archive and verify Linux candidate transport
        shell: bash
        run: |
          set -euo pipefail
          archive_root="$RUNNER_TEMP/mts-release-transport"
          release_name="$(basename "$MTS_LINUX_OUTPUT")"
          archive="$archive_root/${release_name}.tar.gz"
          roundtrip_root="$RUNNER_TEMP/mts-release-roundtrip"
          mkdir -p "$archive_root" "$roundtrip_root"
          tar -czf "$archive" -C "$(dirname "$MTS_LINUX_OUTPUT")" "$release_name"
          (
            cd "$archive_root"
            sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
          )
          tar -xzf "$archive" -C "$roundtrip_root"
          python3 - "$roundtrip_root/$release_name" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          release = Path(sys.argv[1])
          manifest_path = release / "linux-release-manifest.json"
          manifest_bytes = manifest_path.read_bytes()
          expected_manifest = (
              release / "linux-release-manifest.json.sha256"
          ).read_text(encoding="ascii").strip()
          assert hashlib.sha256(manifest_bytes).hexdigest() == expected_manifest
          manifest = json.loads(manifest_bytes)
          for item in manifest["artifacts"]:
              artifact = release / item["path"]
              assert artifact.stat().st_size == item["size"]
              assert hashlib.sha256(artifact.read_bytes()).hexdigest() == item["sha256"]
              if item["bundle"] == "appimage":
                  assert os.access(artifact, os.X_OK)
          assert all(
              item["verified"]
              for item in manifest["runtimeBootstrap"]["artifactVerifications"]
          )
          PY

      - name: Upload mode-preserving Linux candidate archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mts-linux-${{ inputs.target }}
          path: ${{ runner.temp }}/mts-release-transport/*
          if-no-files-found: error
          retention-days: 14
