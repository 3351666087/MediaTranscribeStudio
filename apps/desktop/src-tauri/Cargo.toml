[package]
name = "media-transcribe-studio"
version = "0.1.0"
description = "Offline dynamic-speaker Chinese meeting transcription workspace"
authors = ["MediaTranscribe Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "media_transcribe_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
